[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udarenie"
version = "1.0.0"
description = "Russian text accentuation library combining dictionary-based and neural approaches"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
authors = [
    {name = "omogrus", email = "omogrus@ya.ru"},
]
keywords = ["russian", "accentuation", "stress", "nlp", "tts", "udarenie"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=1.9.0",
    "transformers>=4.0.0",
    "numpy>=1.19.0",
    # добавьте остальные зависимости
]

[project.urls]
Homepage = "https://github.com/omogr/udarenie"
Repository = "https://github.com/omogr/udarenie"
Issues = "https://github.com/omogr/udarenie/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["udarenie*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
udarenie = ["py.typed"]